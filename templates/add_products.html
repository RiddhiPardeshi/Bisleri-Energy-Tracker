{% extends "base.html" %}

{% block page_title %}Add Product{% endblock %}

{% block content %}

<div class="card shadow-sm" style="max-width:780px;">

    <div class="card-header bg-success text-white">
        <i class="bi bi-box2-heart"></i> Add Product
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Product Name</label>
                    <input type="text" name="product_name" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Category</label>
                    <select name="category" class="form-select">
                        <option>Bottled Water</option>
                        <option>Soda / Carbonated</option>
                        <option>Juice</option>
                        <option>Bulk Jar</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Unit</label>
                    <input type="text" name="unit" class="form-control" placeholder="e.g. 1L Bottle, 20L Jar">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Unit Price (₹)</label>
                    <input type="number" step="0.01" name="unit_price" class="form-control" required>
                </div>

                <div class="col-md-12 mb-3">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>

            </div>

            <button class="btn btn-success">
                <i class="bi bi-save"></i> Save Product
            </button>

            <a href="{{ url_for('products_page') }}" class="btn btn-outline-secondary">Cancel</a>

        </form>

    </div>

</div>

{% endblock %}
