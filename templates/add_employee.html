{% extends "base.html" %}

{% block page_title %}Add Employee{% endblock %}

{% block content %}

<div class="card shadow-sm" style="max-width:780px;">

    <div class="card-header bg-success text-white">
        <i class="bi bi-person-plus"></i> Add Employee
    </div>

    <div class="card-body">

        <form method="POST" autocomplete="off">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" autocomplete="off" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Designation</label>
                    <input type="text" name="designation" class="form-control" placeholder="e.g. Line Supervisor">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" autocomplete="off" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" autocomplete="new-password" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone</label>
                    <input type="text" name="phone" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Role / Access Level</label>
                    <select name="role" class="form-select" required>
                        {% for r in roles %}
                        <option value="{{ r }}">{{ r }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text">
                        Admin: full access &nbsp;|&nbsp;
                        Manager: everything except employee management &nbsp;|&nbsp;
                        Operator: entries, records, stock, attendance
                    </div>
                </div>

            </div>

            <button class="btn btn-success">
                <i class="bi bi-save"></i> Save Employee
            </button>

            <a href="{{ url_for('employees_page') }}" class="btn btn-outline-secondary">Cancel</a>

        </form>

    </div>

</div>

{% endblock %}
