{% extends "base.html" %}

{% block content %}

<h2>Add Stock</h2>

<form method="POST">

<div class="row">

<div class="col-md-6">

<label>Item Name</label>

<input
type="text"
name="item_name"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Category</label>

<select
name="category"
class="form-control">

<option>Preform</option>

<option>Cap</option>

<option>Label</option>

<option>Shrink Roll</option>

<option>Carton</option>

</select>

</div>

<div class="col-md-3 mt-3">

<label>Opening Stock</label>

<input
type="number"
name="opening_stock"
class="form-control"
required>

</div>

<div class="col-md-3 mt-3">

<label>Stock In</label>

<input
type="number"
name="stock_in"
class="form-control"
value="0">

</div>

<div class="col-md-3 mt-3">

<label>Stock Out</label>

<input
type="number"
name="stock_out"
class="form-control"
value="0">

</div>

<div class="col-md-3 mt-3">

<label>Unit</label>

<input
type="text"
name="unit"
class="form-control"
placeholder="Kg / Nos">

</div>

</div>

<br>

<button class="btn btn-success">
Save Stock
</button>

</form>

{% endblock %}
