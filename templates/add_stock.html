{% extends "base.html" %}

{% block page_title %}Add Stock{% endblock %}

{% block content %}

<div class="card shadow-sm" style="max-width:780px;">

    <div class="card-header bg-success text-white">
        <i class="bi bi-boxes"></i> Add Stock
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Item Name</label>
                    <input type="text" name="item_name" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Category</label>
                    <select name="category" class="form-select">
                        <option>Preform</option>
                        <option>Cap</option>
                        <option>Label</option>
                        <option>Shrink Roll</option>
                        <option>Carton</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Opening Stock</label>
                    <input type="number" name="opening_stock" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Stock In</label>
                    <input type="number" name="stock_in" class="form-control" value="0">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Stock Out</label>
                    <input type="number" name="stock_out" class="form-control" value="0">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Unit</label>
                    <input type="text" name="unit" class="form-control" placeholder="Kg / Nos">
                </div>

            </div>

            <button class="btn btn-success">
                <i class="bi bi-save"></i> Save Stock
            </button>

            <a href="{{ url_for('stock') }}" class="btn btn-outline-secondary">Cancel</a>

        </form>

    </div>

</div>

{% endblock %}
