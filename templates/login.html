<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bisleri Energy Monitoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-shell">

    <div class="auth-card">

        <div class="auth-brand">
            <div class="bolt"><i class="bi bi-lightning-charge-fill"></i></div>
            <h3>Bisleri Login</h3>
            <p>Energy Monitoring System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required autofocus autocomplete="off">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required autocomplete="off">
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

            <div class="text-center mt-3">
                <p class="mb-2 text-muted small">Don't have an account?</p>
                <a href="{{ url_for('register') }}" class="btn btn-outline-primary w-100">
                    Create Account
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
